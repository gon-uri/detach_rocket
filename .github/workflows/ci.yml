name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# setup-uv is pinned to an exact version on purpose: since v8 that action no
# longer publishes floating major tags, so `@v10` does not resolve.

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest
