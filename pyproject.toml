[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------
[project]
name = "detach_rocket"
version = "0.1.0"
description = "Sequential Feature Detachment for Random Convolutional Kernel models."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Gonzalo Uribarri" },
    { name = "Federico Barone" },
]
keywords = ["time-series", "classification", "feature-selection", "rocket", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# -- Runtime dependencies ---------------------------------------------------
dependencies = [
    # Support both NumPy 1.26+ and NumPy 2.x while staying within the tested
    # compatibility range of the current time-series/scientific Python stack.
    "numpy>=1.26.4,<2.5",

    # Match sktime's supported scikit-learn range explicitly, instead of
    # relying on pip to discover this transitive constraint during resolution.
    "scikit-learn>=1.7.2,<1.8",

    "sktime>=0.40.1",

    # Needed by sktime's ROCKET transformers, not by this package directly.
    # Keep the floor low so a conda-installed numba (see README
    # Troubleshooting) satisfies it on platforms without recent wheels.
    "numba>=0.58",
]

# -- Optional dependency groups ---------------------------------------------
[project.optional-dependencies]
# DetachEnsemble with PyTorch backend (PytorchMiniRocketMultivariate)
torch = [
    "torch>=2.2.2",
    # On macOS x86_64 (including Rosetta condas on Apple Silicon) the newest
    # available torch wheel is 2.2.2, which was built against NumPy 1.x and
    # breaks at runtime with NumPy >= 2 (torch<->numpy conversions fail).
    "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# DetachEnsemble with CUDA backend (CudaMiniRocketMultivariate)
cuda = ["cupy-cuda12x>=13.0"]
# aeon ROCKET-family transformers (physical pruning for aeon's Rocket)
aeon = ["aeon>=1.5,<2"]
# Dataset download utilities (utils_datasets.py)
datasets = ["scipy>=1.17.1", "pyts>=0.13.0"]
# Jupyter notebook examples
examples = ["matplotlib>=3.10.8", "ipykernel>=7.2.0"]
# Development / testing
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]
# Install everything
all = [
    "detach_rocket[torch,cuda,aeon,datasets,examples,dev]",
]

[project.urls]
Homepage = "https://github.com/gon-uri/detach_rocket"
Repository = "https://github.com/gon-uri/detach_rocket"
Issues = "https://github.com/gon-uri/detach_rocket/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["detach_rocket*"]
exclude = ["tests*", "examples*", "logo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::UserWarning:sklearn",
    "ignore::scipy.linalg.LinAlgWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# Lint/format the library and tests only; notebooks are user-facing documents.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
