[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------
[project]
name = "detach_rocket"
version = "0.1.0"
description = "Sequential Feature Detachment for Random Convolutional Kernel models."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Gonzalo Uribarri" },
    { name = "Federico Barone" },
]
keywords = ["time-series", "classification", "feature-selection", "rocket", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# -- Runtime dependencies ---------------------------------------------------
dependencies = [
    "numpy>=1.26.4,<2",      # <2 required for torch 2.2.x compatibility
    "scikit-learn>=1.7.2",
    "sktime>=0.40.1",
    "numba>=0.61.2",
]

# -- Optional dependency groups ---------------------------------------------
[project.optional-dependencies]
# DetachEnsemble with PyTorch backend (PytorchMiniRocketMultivariate)
torch = ["torch>=2.2.2"]
# DetachEnsemble with CUDA backend (CudaMiniRocketMultivariate)
cuda = ["cupy-cuda12x>=13.0"]
# Dataset download utilities (utils_datasets.py)
datasets = ["scipy>=1.17.1", "pyts>=0.13.0"]
# Jupyter notebook examples
examples = ["matplotlib>=3.10.8", "ipykernel>=7.2.0"]
# Development / testing
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]
# Install everything
all = [
    "detach_rocket[torch,cuda,datasets,examples,dev]",
]

[project.urls]
Homepage = "https://github.com/gon-uri/detach_rocket"
Repository = "https://github.com/gon-uri/detach_rocket"
Issues = "https://github.com/gon-uri/detach_rocket/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["detach_rocket*"]
exclude = ["tests*", "examples*", "logo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::UserWarning:sklearn",
    "ignore::scipy.linalg.LinAlgWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
